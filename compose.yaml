services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: it_job_market
      POSTGRES_USER: data_ana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_ana -d it_job_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
