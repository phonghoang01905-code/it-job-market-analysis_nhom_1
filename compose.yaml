services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: it_job_market
      POSTGRES_USER: data_ana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_ana -d it_job_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase-db:
    profiles: ["bi"]
    image: postgres:17
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_APP_PASSWORD:-local-bi-app-only}
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    profiles: ["bi"]
    image: metabase/metabase:v0.64.1
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_APP_PASSWORD:-local-bi-app-only}
      MB_DB_HOST: metabase-db
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
      MB_SITE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  metabase_data:
