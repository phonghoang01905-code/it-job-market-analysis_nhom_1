[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-job-market-analysis"
version = "0.1.0"
description = "Analyze Vietnam IT job market trends from public recruitment listings."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hoang Cao Phong" },
  { name = "Vu Thi Dieu Linh" }
]
dependencies = [
  "altair>=5.0,<6",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pypdf>=6.0,<7",
  "python-docx>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.31",
  "seaborn>=0.13",
  "streamlit>=1.32"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_ana = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

